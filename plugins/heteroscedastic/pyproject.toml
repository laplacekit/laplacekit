[project]
name = "laplacekit-heteroscedastic"
version = "0.1a0"
description = "Heteroscedastic regression for laplacekit: a Gaussian likelihood in natural parameters"
authors = [{ name = "Agustinus Kristiadi", email = "agustinus@kristia.de" }]
license = "MIT"
requires-python = ">=3.13"
dependencies = ["laplacekit>=0.1a0,<0.2"]

[project.entry-points."laplacekit.plugins"]
laplacekit_heteroscedastic = "laplacekit_heteroscedastic:plugin"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
laplacekit = { workspace = true }
