[project]
name = "laplacekit-gp"
version = "0.1a0"
description = "GP methods for laplacekit: function-space Laplace with Nystrom features, inducing points and GP priors"
authors = [{ name = "Agustinus Kristiadi", email = "agustinus@kristia.de" }]
license = "MIT"
requires-python = ">=3.13"
dependencies = ["laplacekit>=0.1a0,<0.2"]

[project.entry-points."laplacekit.plugins"]
laplacekit_gp = "laplacekit_gp:plugin"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
laplacekit = { workspace = true }
