        - core.Pass
        - core.Running
        - core.Done
        - core.Finished
        - core.FitContext
        - core.FitStat
    - subtitle: Data and models
      desc: "`Params` is the type alias `Mapping[str, Tensor]`: parameters by name."
      contents:
